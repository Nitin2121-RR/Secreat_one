<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Do You Love Me? 💕</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Floating hearts and cute animals background -->
    <div class="floating-hearts">
        <span class="floating-heart">💖</span>
        <span class="floating-heart">�</span>
        <span class="floating-heart">�💕</span>
        <span class="floating-heart">�</span>
        <span class="floating-heart">�💗</span>
        <span class="floating-heart">🐷</span>
        <span class="floating-heart">🐼</span>
        <span class="floating-heart">💘</span>
    </div>

    <!-- Question Container -->
    <div class="glass-container" id="questionContainer">
        <div class="shimmer"></div>
        <h1 class="question">
            <span class="question-word">Do</span>
            <span class="question-word">You</span>
            <span class="question-word">Love</span>
            <span class="question-word">Me?</span>
            <span class="emoji-heart">💕</span>
            <span class="emoji-animals">🐷🐼</span>
        </h1>
        <div class="buttons">
            <button class="btn yes-btn" id="yesBtn">
                <span class="btn-text">Yes! 💖</span>
                <div class="btn-ripple"></div>
            </button>
            <button class="btn no-btn" id="noBtn">
                <span class="btn-text">No</span>
                <div class="btn-ripple"></div>
            </button>
        </div>
    </div>

    <!-- Celebration Container -->
    <div class="celebration-wrapper" id="celebrationContainer">
        <div class="glass-container celebration-content">
            <div class="shimmer"></div>
            <h1 class="celebration-title">
                <span class="title-word">I</span>
                <span class="title-word">knew</span>
                <span class="title-word">it!</span>
                <span class="emoji-sparkle">💕✨</span>
            </h1>
            <p class="celebration-text">You made my day! Here's us together...</p>
            
            <div class="image-gallery">
                <div class="gallery-item">
                    <div class="gallery-card">
                        <img src="1.jpg" alt="Beautiful moments" class="gallery-img">
                        <div class="image-overlay">
                            <p class="image-caption">Beautiful moments 💕</p>
                        </div>
                    </div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-card">
                        <img src="2.jpg" alt="Forever together" class="gallery-img">
                        <div class="image-overlay">
                            <p class="image-caption">Forever & Always 💑</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cute-animals">
                <div class="animal-emoji pig">🐷</div>
                <div class="animal-emoji panda">🐼</div>
            </div>

            <div class="hearts-animation">
                <div class="heart">💖</div>
                <div class="heart">🐷</div>
                <div class="heart">💕</div>
                <div class="heart">🐼</div>
                <div class="heart">💗</div>
                <div class="heart">💝</div>
                <div class="heart">�</div>
                <div class="heart">�</div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
